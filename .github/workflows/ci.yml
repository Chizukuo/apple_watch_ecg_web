name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Chizukuo/apple_watch_ecg
          ref: a7262bdbb271fd51960adf08004362885b3bc939
          path: python-reference
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r python-reference/requirements.txt pytest requests
      - name: Formatting
        run: npm run format:check
      - name: Type check
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Chinese fonts for reference plots
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Independent Python reference tests
        run: python -m pytest python-reference/tests -q
      - name: HTTP numerical and behavioral parity
        run: npm run test:integration
        env:
          APPLE_WATCH_ECG_PY_DIR: ${{ github.workspace }}/python-reference
      - name: Install browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Browser workflow and exports
        if: runner.os == 'Linux'
        run: npm run test:e2e
      - name: Dependency audit
        run: npm audit --audit-level=moderate
